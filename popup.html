<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StockFlo Analyzer</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1>StockFlo Analyzer</h1>

  <div class="finviz-section">
    <h3>Finviz Ticker Tools</h3>
    <div class="finviz-buttons">
      <button id="fetchTickersBtn">Fetch Tickers from Current Finviz Page</button>
      <button id="openFinvizBtn">Open Finviz Screener</button>
    </div>
    <div id="finviz-status" class="status ready">Ready to fetch tickers</div>
    <div class="divider"></div>
  </div>

  <div class="symbol-input">
    <input type="text" id="manual-symbol" placeholder="Enter symbol (e.g., AAPL)">
    <button id="add-symbol">Add</button>
  </div>

  <div class="symbol-list">
    <h3>Selected Symbols</h3>
    <ul id="selected-symbols"></ul>
  </div>

  <div class="workflow-selection">
    <h3>Select Workflow</h3>
    <select id="workflow-select">
      <option value="">Loading workflows...</option>
    </select>
  </div>

  <div class="actions">
    <button id="analyze-button" disabled>Analyze Symbols</button>
    <div id="status-message"></div>
  </div>

  <div class="execution-status" id="execution-status" style="display: none;">
    <h3>Analysis Status</h3>
    <div class="status-details">
      <div>Status: <span id="status-value">Running</span></div>
      <div>Started: <span id="started-at">-</span></div>
      <div>Completed: <span id="completed-at">-</span></div>
      <div class="progress-bar">
        <div id="progress-indicator"></div>
      </div>
    </div>
    <button id="view-results" disabled>View Results</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
