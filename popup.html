<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stock Market Analysis</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      width: 350px;
      padding: 15px;
    }
    h1 {
      color: #333;
      font-size: 18px;
      margin-top: 0;
    }
    button {
      padding: 8px 12px;
      background-color: #4285f4;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      margin-bottom: 10px;
    }
    button:hover {
      background-color: #3367d6;
    }
    #tickerList {
      max-height: 300px;
      overflow-y: auto;
      border: 1px solid #ddd;
      padding: 10px;
      margin-top: 10px;
      background-color: #f9f9f9;
    }
    .ticker-item {
      margin-bottom: 5px;
      padding: 5px;
      border-bottom: 1px solid #eee;
    }
    #status {
      margin-top: 10px;
      color: #666;
      font-style: italic;
    }
    .loading {
      color: #ff9800;
    }
    .success {
      color: #4caf50;
    }
    .warning {
      color: #ff9800;
    }
    .error {
      color: #f44336;
    }
    .ready {
      color: #2196F3;
    }
  </style>
</head>
<body>
  <h1>Stock Market Analysis</h1>

  <button id="fetchTickersBtn">Fetch Tickers from Current Finviz Page</button>
  <button id="openFinvizBtn">Open Finviz Screener</button>

  <div id="status">Ready to fetch tickers.</div>

  <div id="tickerList"></div>

  <script src="popup.js"></script>
</body>
</html>
